<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Дмитрий & Юлия</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #fdf6f0;
  color: #4a3f35;
}

/* HERO */
.hero {
  height: 100vh;
  background: url('1.jpg') center/cover no-repeat;
  position: relative;
}

.overlay {
  background: rgba(0,0,0,0.35);
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-text {
  color: white;
  text-align: center;
}

.hero-text h1 {
  font-family: 'Playfair Display', serif;
  font-size: 48px;
  letter-spacing: 4px;
  margin: 0;
}

.and {
  font-size: 20px;
  margin: 10px 0;
  opacity: 0.8;
}

.line {
  width: 60px;
  height: 1px;
  background: white;
  margin: 20px auto;
}

.invite {
  font-size: 16px;
  line-height: 1.6;
  opacity: 0.9;
}

.date {
  margin-top: 20px;
  letter-spacing: 3px;
  font-size: 18px;
}

/* GALLERY */
section {
  padding: 80px 20px;
  text-align: center;
}

.gallery {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-width: 600px;
  margin: auto;
}

.gallery img {
  width: 100%;
  border-radius: 12px;
}

/* MAP */
.button {
  padding: 14px 28px;
  border: 1px solid #c8a2a2;
  color: #c8a2a2;
  margin: 10px;
  cursor: pointer;
  display: inline-block;
}

.button:hover {
  background: #c8a2a2;
  color: white;
}

/* RSVP */
input {
  padding: 12px;
  width: 220px;
  margin: 10px;
  border: 1px solid #ddd;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <div class="overlay">
    <div class="hero-text">
      <h1>Дмитрий</h1>
      <div class="and">&</div>
      <h1>Юлия</h1>

      <div class="line"></div>

      <p class="invite">
        Будем счастливы разделить<br>
        этот день вместе с вами
      </p>

      <div class="date">
        21 • 08 • 2026
      </div>
    </div>
  </div>
</section>

<!-- GALLERY -->
<section>
  <div class="gallery">
    <img src="галерея.jpg">
    <img src="шапка.jpg">
    
  </div>
</section>

<!-- MAP -->
<section>
  <h2>Банкет</h2>

  <p style="font-size:20px;">Moon Magic ✨</p>
  <p>Чебоксары</p>

  <div style="max-width:700px; margin:20px auto; border-radius:16px; overflow:hidden;">
    <iframe 
      src="https://yandex.ru/map-widget/v1/?text=Moon Magic Чебоксары&z=16" 
      width="100%" 
      height="320" 
      frameborder="0">
    </iframe>
  </div>

  <a href="https://yandex.ru/maps/-/CPfkQ42m" target="_blank">
    <div class="button">📍 Проложить маршрут</div>
  </a>
</section>

<!-- RSVP -->
<section>
  <h2>Подтвердите участие</h2>

  <input id="name" placeholder="Ваше имя">

  <br>

  <div class="button" onclick="send('Приду')">Приду ❤️</div>
  <div class="button" onclick="send('Не приду')">Не приду</div>

  <p id="status"></p>
</section>

<script>
function send(answer) {
  const name = document.getElementById('name').value;

  if (!name) {
    alert("Введите имя");
    return;
  }

  fetch("https://api.telegram.org/botВАШ_ТОКЕН/sendMessage", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      chat_id: "ВАШ_CHAT_ID",
      text: "💍 Свадьба\nИмя: " + name + "\nОтвет: " + answer
    })
  });

  document.getElementById("status").innerText =
    "Спасибо! Ответ отправлен 💌";
}
</script>

</body>
</html>
